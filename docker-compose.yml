services:
  web:
    build: .
    container_name: malware-comparison-web
    ports:
      - "8080:80"
    environment:
      - MONGODB_URL=${MONGODB_URL}
      - VIRTUSTOTAL_API=${VIRTUSTOTAL_API}
    volumes:
      - ./View:/var/www/html/View
      - ./Controller:/var/www/html/Controller
      - ./Model:/var/www/html/Model
      - ./css:/var/www/html/css
      - ./js:/var/www/html/js
      - ./assets:/var/www/html/assets
    depends_on:
      db:
        condition: service_healthy # ✅ מחכה שה-DB יהיה מוכן באמת
    restart: unless-stopped
    networks:
      - malware-network

  db:
    image: mongo:7.0
    container_name: malware-comparison-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: malware_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    healthcheck:
      # ✅ בודק שMongo מוכן
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - malware-network

networks:
  malware-network:
    driver: bridge

volumes:
  mongodb_data:
